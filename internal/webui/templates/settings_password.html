<div style="margin-top:0;">
    <h1 class="page-title"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg?v=adb0669912b5d0ff#i-lock"/></svg>{{T "password.heading"}}</h1>

    {{if .Error}}
    <div class="error-message">{{.Error}}</div>
    {{end}}

    <div class="settings-section">
        <h2><svg class="icon" aria-hidden="true"><use href="/static/icons.svg?v=adb0669912b5d0ff#i-lock"/></svg>{{T "password.set_new"}}</h2>
        <p style="font-size:0.875rem;color:var(--muted);margin-bottom:1rem;">
            {{T "password.hint" .MinPasswordLength}}
        </p>
        <form action="/settings/password" method="post">
            <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
            <div class="form-group">
                <label for="current_password">{{T "password.current"}}</label>
                <input type="password" id="current_password" name="current_password" required autocomplete="current-password">
            </div>
            <div class="form-group">
                <label for="new_password">{{T "auth.new_password_placeholder"}}</label>
                <input type="password" id="new_password" name="new_password" required minlength="{{.MinPasswordLength}}" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label for="confirm_password">{{T "auth.confirm_new_password_placeholder"}}</label>
                <input type="password" id="confirm_password" name="confirm_password" required minlength="{{.MinPasswordLength}}" autocomplete="new-password">
            </div>
            <input type="submit" class="btn btn-primary" value="{{T "auth.change_password_button"}}">
        </form>
    </div>

    <div style="margin-top:1rem;">
        <a href="/settings" class="btn btn-ghost" style="font-size:0.875rem;"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg?v=adb0669912b5d0ff#i-home"/></svg>{{T "sessions.back_to_settings"}}</a>
    </div>
</div>
