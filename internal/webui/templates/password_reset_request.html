<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-mark"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg?v=adb0669912b5d0ff#i-lock"/></svg></div>
        <h1>little<span>fedi</span></h1>
        <p class="sub">{{T "auth.reset_password_subtitle"}}</p>
        {{if .Error}}
        <div class="error-message"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg?v=adb0669912b5d0ff#i-alert"/></svg><span>{{.Error}}</span></div>
        {{end}}
        {{if .Info}}
        <div class="info-message">
            <p>{{.Info}}</p>
        </div>
        {{end}}
        <form action="/auth/password/new" method="post">
            <label class="sr-only" for="password-reset-request-username">{{T "auth.username_placeholder"}}</label>
            <input id="password-reset-request-username" type="text" name="username" class="field" placeholder="{{T "auth.username_placeholder"}}" value="{{.Username}}" required>
            <input type="submit" class="btn btn-primary" value="{{T "auth.send_reset_token"}}">
        </form>
        <p class="sub" style="margin-top:1.2rem;margin-bottom:0;">
            <a href="/auth/sign_in">{{T "auth.back_to_sign_in"}}</a>
        </p>
    </div>
</div>
