<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-mark"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg?v=adb0669912b5d0ff#i-lock"/></svg></div>
        <h1>little<span>fedi</span></h1>
        <p class="sub">{{T "auth.set_new_password_subtitle"}}</p>
        {{if .Error}}
        <div class="error-message"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg?v=adb0669912b5d0ff#i-alert"/></svg><span>{{.Error}}</span></div>
        {{end}}
        <form action="/auth/password/edit" method="post">
            <label class="sr-only" for="password-reset-edit-password">{{T "auth.new_password_placeholder"}}</label>
            <input id="password-reset-edit-password" type="password" name="password" class="field" placeholder="{{T "auth.new_password_placeholder"}}" required minlength="{{.MinPasswordLength}}" autocomplete="new-password">
            <label class="sr-only" for="password-reset-edit-password-confirm">{{T "auth.confirm_new_password_placeholder"}}</label>
            <input id="password-reset-edit-password-confirm" type="password" name="password_confirm" class="field" placeholder="{{T "auth.confirm_new_password_placeholder"}}" required minlength="{{.MinPasswordLength}}" autocomplete="new-password">
            <input type="submit" class="btn btn-primary" value="{{T "auth.change_password_button"}}">
        </form>
        <p class="sub" style="margin-top:1.2rem;margin-bottom:0;">
            <a href="/auth/sign_in">{{T "auth.back_to_sign_in"}}</a>
        </p>
    </div>
</div>
