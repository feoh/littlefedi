<div style="max-width:560px;">
    <h1 class="page-title"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg?v=adb0669912b5d0ff#i-alert"/></svg>{{T "report.heading"}} @{{.Target.Username}}{{if .Target.Domain}}@{{.Target.Domain}}{{end}}</h1>

    <p style="font-size:0.875rem;color:var(--muted);margin-bottom:1.2rem;">
        {{T "report.intro"}}
        {{if .StatusID}}{{T "report.intro_or_post"}}{{end}}.
    </p>

    <form action="/report" method="post" style="display:flex;flex-direction:column;gap:1rem;">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        <input type="hidden" name="account" value="{{.Target.ID}}">
        {{if .StatusID}}<input type="hidden" name="status" value="{{.StatusID}}">{{end}}

        <label style="display:flex;flex-direction:column;gap:0.35rem;font-size:0.875rem;">
            <span>{{T "report.category"}}</span>
            <select name="category" class="field">
                <option value="spam">{{T "report.category_spam"}}</option>
                <option value="violation">{{T "report.category_violation"}}</option>
                <option value="legal">{{T "report.category_legal"}}</option>
                <option value="other" selected>{{T "report.category_other"}}</option>
            </select>
        </label>

        <label style="display:flex;flex-direction:column;gap:0.35rem;font-size:0.875rem;">
            <span>{{T "report.comments"}}</span>
            <textarea name="comment" rows="4" class="field" placeholder="{{T "report.comments_placeholder"}}"></textarea>
        </label>

        {{if .Target.Domain}}
        <label style="display:flex;align-items:center;gap:0.5rem;font-size:0.875rem;">
            <input type="checkbox" name="forward" value="on">
            <span>{{T "report.forward" .TargetDomain}}</span>
        </label>
        {{end}}

        <div style="display:flex;gap:0.6rem;">
            <button type="submit" class="btn btn-primary">{{T "report.submit"}}</button>
            <a href="/@{{.Target.Username}}{{if .Target.Domain}}@{{.Target.Domain}}{{end}}" class="btn btn-ghost">{{T "composer.cancel"}}</a>
        </div>
    </form>
</div>
