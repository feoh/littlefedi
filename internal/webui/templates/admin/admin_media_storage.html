<div class="auth-card" style="max-width:760px;text-align:left"><h1>Media storage</h1>
{{with .Migration}}<p><strong>{{.State}}</strong> - {{.Copied}} copied, {{.Failed}} failed</p>{{if .LastError}}<p class="error">{{.LastError}}</p>{{end}}<form method="post" action="/admin/media-storage/{{.ID}}/cancel"><input type="hidden" name="csrf_token" value="{{$.CSRFToken}}"><button class="btn btn-ghost">Cancel</button></form><form method="post" action="/admin/media-storage/{{.ID}}/resume"><input type="hidden" name="csrf_token" value="{{$.CSRFToken}}"><button class="btn btn-primary">Resume/retry</button></form>{{else}}
<p>New uploads switch to the destination when the server is restarted with the destination configuration. Cache objects are invalidated, never copied.</p>
<form method="post" action="/admin/media-storage/start"><input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
<label>Backend <select name="backend"><option value="s3">S3 compatible</option><option value="local">Local</option></select></label>
<label>Local path <input name="path" value="{{.Config.Path}}"></label><label>Public base URL <input name="public_base_url" value="{{.Config.PublicBaseURL}}"></label>
<label>Bucket <input name="bucket" value="{{.Config.S3.Bucket}}" required></label><label>Region <input name="region" value="{{.Config.S3.Region}}"></label><label>Endpoint <input name="endpoint" value="{{.Config.S3.Endpoint}}"></label><label>Prefix <input name="prefix" value="{{.Config.S3.Prefix}}"></label>
<label><input type="checkbox" name="path_style" value="true" {{if .Config.S3.PathStyle}}checked{{end}}> Path-style requests</label><input type="hidden" name="cache_backend" value="{{.Config.CacheBackend}}"><button class="btn btn-primary">Start native migration</button></form>{{end}}</div>
