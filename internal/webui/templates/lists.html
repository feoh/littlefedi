<div class="timeline">
    <div class="profile-header" style="padding:1.1rem;">
        <h1 class="profile-name" style="font-size:1.2rem;">{{T "lists.heading"}}</h1>
        <div class="profile-meta" style="color:var(--muted);font-size:0.85rem;">{{T "lists.subtitle"}}</div>
    </div>

    {{if .Error}}
    <div class="empty-state" role="alert" style="color:var(--danger,#c0392b);padding:0.85rem 1.1rem;">{{.Error}}</div>
    {{end}}

    <form method="post" action="/lists" class="settings-section" style="padding:1.1rem;display:flex;flex-direction:column;gap:0.6rem;">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        <div class="form-group">
            <label for="new-list-title">{{T "lists.new_name"}}</label>
            <input type="text" id="new-list-title" name="title" required maxlength="120"
                   placeholder="{{T "lists.new_name_placeholder"}}" style="width:100%;">
        </div>
        <div class="form-group">
            <label for="new-list-replies">{{T "lists.show_replies_to"}}</label>
            <select id="new-list-replies" name="replies_policy">
                <option value="list">{{T "lists.replies_list_members"}}</option>
                <option value="followed">{{T "lists.replies_followed"}}</option>
                <option value="none">{{T "lists.replies_none"}}</option>
            </select>
        </div>
        <label style="display:flex;align-items:center;gap:0.5rem;font-size:0.9rem;">
            <input type="checkbox" name="exclusive" value="1">
            {{T "lists.exclusive_help"}}
        </label>
        <div>
            <button class="btn btn-primary" type="submit">{{T "lists.create"}}</button>
        </div>
    </form>

    {{if .Lists}}
    <div class="lists-list">
        {{range .Lists}}
        <div class="status" style="display:flex;align-items:center;justify-content:space-between;gap:0.85rem;padding:0.85rem 1.1rem;">
            <a href="/lists/{{.ID}}" style="font-weight:700;font-size:0.95rem;color:var(--text);">
                {{.Title}}
                {{if .Exclusive}}<span style="color:var(--muted);font-weight:400;font-size:0.8rem;margin-left:0.35rem;">{{T "lists.exclusive_badge"}}</span>{{end}}
            </a>
            <form method="post" action="/lists/{{.ID}}/delete" data-confirm="{{T "lists.delete_confirm" .Title}}" style="display:inline-flex;">
                <input type="hidden" name="csrf_token" value="{{$.CSRFToken}}">
                <button class="btn btn-ghost" type="submit">{{T "status.action.delete"}}</button>
            </form>
        </div>
        {{end}}
    </div>
    {{else}}
    <div class="empty-state">
        <div class="empty-icon"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg?v=adb0669912b5d0ff#i-users"/></svg></div>
        <h2>{{T "lists.empty_heading"}}</h2>
        <p>{{T "lists.empty_body"}}</p>
    </div>
    {{end}}
</div>
