<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>Offline | littleFedi</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{font-size:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.6;color:#171a21;background:#f5f7fa;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
  @media(prefers-color-scheme:dark){body{color:#e8edf5;background:#0c0f14}p{color:#9aa2b4}}
  .card{max-width:26rem;text-align:center}
  .mark{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#14b8a6 0%,#0e9488 55%,#0891b2 100%);margin:0 auto 1.2rem;box-shadow:0 10px 24px rgba(13,148,136,.35);display:flex;align-items:center;justify-content:center}
  .mark svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  h1{font-size:1.4rem;font-weight:800;letter-spacing:-.02em;margin-bottom:.5rem}
  p{color:#5a6070;font-size:.95rem;margin-bottom:1.4rem}
  a{display:inline-flex;align-items:center;justify-content:center;padding:.6rem 1.15rem;border-radius:999px;font-size:.875rem;font-weight:650;background:linear-gradient(135deg,#0f766e 0%,#0d6d66 55%,#0e7490 100%);color:#fff;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <div class="mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 20 4.5-1.2L19 8.3a3 3 0 0 0-4.2-4.2L4.3 14.6z"/><path d="m13.5 5.5 4.2 4.2"/><path d="m4 20 3.2-1.1L5.1 16.8z"/></svg></div>
  <h1>You're offline</h1>
  <p>littleFedi can't reach the server right now. Check your connection and try again.</p>
  <a href="/">Retry</a>
</div>
</body>
</html>
