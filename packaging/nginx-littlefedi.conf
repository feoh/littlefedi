limit_req_zone $binary_remote_addr zone=lf_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=lf_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=lf_inbox:10m rate=30r/s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name social.example.com;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name social.example.com;

    ssl_certificate /etc/letsencrypt/live/social.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/social.example.com/privkey.pem;
    client_max_body_size 41m;

    location ~ ^/(auth/(sign_in|sign_up|password)|api/v1/(apps|accounts)) {
        limit_req zone=lf_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/littlefedi-proxy-headers.conf;
    }

    location ~ ^/(inbox|users/[^/]+/inbox)$ {
        limit_req zone=lf_inbox burst=100 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/littlefedi-proxy-headers.conf;
    }

    location /api/v1/streaming {
        limit_req zone=lf_general burst=60 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_buffering off;
        include /etc/nginx/littlefedi-proxy-headers.conf;
    }

    location / {
        limit_req zone=lf_general burst=60 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/littlefedi-proxy-headers.conf;
    }
}
