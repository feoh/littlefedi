# pf.conf fragment for a littleFedi host.

set skip on lo

block return
block in

pass out

pass in on egress proto tcp to (egress) port { 80 443 }

# ssh, from the management network only
# pass in on egress proto tcp from 198.51.100.0/24 to (egress) port 22

# lighthouse
# pass in on egress proto tcp to (egress) port 7842

pass in on egress inet proto icmp icmp-type { echoreq unreach }
pass in on egress inet6 proto icmp6
