# nftables ruleset for a littleFedi host.

table inet filter {
	chain input {
		type filter hook input priority filter; policy drop;

		iif lo accept
		ct state established,related accept
		ct state invalid drop

		tcp dport { 80, 443 } accept

		# ssh, from the management network only
		# ip saddr 198.51.100.0/24 tcp dport 22 accept

		# lighthouse
		# tcp dport 7842 accept

		icmp type { echo-request, destination-unreachable } accept
		icmpv6 type { echo-request, destination-unreachable, packet-too-big,
		              time-exceeded, parameter-problem, nd-neighbor-solicit,
		              nd-neighbor-advert, nd-router-advert } accept
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}
