# npf.conf for a littleFedi host. Set $ext_if to your interface.
# Careful: "npfctl start" drops SSH sessions opened before it.

$ext_if = "wm0"

# add 7842 for a lighthouse
$public_tcp = { 80, 443 }

group "external" on $ext_if {
	pass stateful out final all

	pass stateful in final proto tcp to inet4($ext_if) port $public_tcp

	# ssh, from the management network only
	# pass stateful in final proto tcp from 198.51.100.0/24 \
	#     to inet4($ext_if) port ssh

	pass in final proto icmp all
	pass in final proto ipv6-icmp all

	block all
}

group default {
	pass final on lo0 all
	block all
}
