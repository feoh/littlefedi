# ipf.conf for a littleFedi host. Replace vioif0 with your interface.

pass in quick on lo0 all
pass out quick on lo0 all

block in log all
block out all

pass out quick proto tcp all keep state
pass out quick proto udp all keep state
pass out quick proto icmp all keep state

pass in quick on vioif0 proto tcp from any to any port = 80 keep state
pass in quick on vioif0 proto tcp from any to any port = 443 keep state

# ssh, from the management network only
# pass in quick on vioif0 proto tcp from 198.51.100.0/24 to any port = 22 keep state

# lighthouse
# pass in quick on vioif0 proto tcp from any to any port = 7842 keep state

pass in quick proto icmp from any to any icmp-type echo keep state
