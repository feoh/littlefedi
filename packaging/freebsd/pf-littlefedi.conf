# pf.conf fragment for a littleFedi host. Set ext_if to your interface.

ext_if = "vtnet0"

set skip on lo0

block return in all
block out all

pass out quick inet keep state
pass out quick inet6 keep state

pass in on $ext_if proto tcp to ($ext_if) port { 80, 443 } keep state

# ssh, from the management network only
# pass in on $ext_if proto tcp from 198.51.100.0/24 to ($ext_if) port 22 keep state

# lighthouse
# pass in on $ext_if proto tcp to ($ext_if) port 7842 keep state

pass in on $ext_if inet proto icmp icmp-type { echoreq, unreach } keep state
pass in on $ext_if inet6 proto icmp6 keep state
